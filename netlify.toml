# Netlify config — INDOSARI Akuntansi 2026 web app
# Env vars di-set di Netlify dashboard (Site settings > Environment variables)

[build]
  command = "npm run netlify-build"
  publish = ".next"
  installCommand = "npm install"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"
